version: 2

builds:
  - id: changes
    main: .
    binary: changes
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: changes-provider-ast-grep
    main: ./extras/changes-provider-ast-grep
    binary: changes-provider-ast-grep
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
  - id: changes-provider-calldiff
    main: ./extras/changes-provider-calldiff
    binary: changes-provider-calldiff
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
